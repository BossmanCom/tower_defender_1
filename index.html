<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Zombie Tower Defense Mobile</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0f14;
    color: #fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }
  #game-container {
    position: relative;
    width: 100%;
    max-width: 400px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #0e141c;
    touch-action: none;
    max-width: 100%;
    max-height: 100%;
  }
  #ui {
    width: 100%;
    max-width: 400px;
    padding: 8px 12px 12px 12px;
    background: linear-gradient(transparent, rgba(11,15,20, 0.95) 20%);
    box-sizing: border-box;
    z-index: 10;
  }
  .bar {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    justify-content: space-between;
  }
  .stat {
    background: #1a2433;
    padding: 6px 10px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    flex: 1;
    text-align: center;
  }
  .btn-row {
    display: flex;
    gap: 4px;
    margin-bottom: 4px;
  }
  .btn {
    background: #2a3a52;
    border: 0;
    color: #fff;
    padding: 8px 4px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 11px;
    flex: 1;
    cursor: pointer;
    text-align: center;
    transition: background 0.1s;
  }
  .btn:active { background: #3a4a62; }
  .btn-action {
    background: #27ae60;
    font-size: 13px;
    padding: 10px;
    margin-top: 4px;
    width: 100%;
  }
  .btn-action:active { background: #219653; }
  .btn-action:disabled { background: #334; color: #788; cursor: not-allowed; }
  h3 {
    margin: 4px 0 2px;
    font-size: 12px;
    color: #89a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #action-tip {
    font-size: 11px;
    color: #f39c12;
    text-align: center;
    min-height: 16px;
    margin-bottom: 2px;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="game" width="400" height="640"></canvas>
</div>

<div id="ui">
  <div class="bar">
    <div class="stat" id="money">💰 120</div>
    <div class="stat" id="wave">Wave 1</div>
    <div class="stat" id="base">❤️ 100</div>
  </div>
  <div id="action-tip">Intermission: Buy upgrades, then start next wave!</div>
  
  <h3>Weapon Upgrades</h3>
  <div class="btn-row" id="weaponUpgrades"></div>
  
  <h3>Defence Upgrades</h3>
  <div class="btn-row" id="defUpgrades"></div>

  <button class="btn btn-action" id="waveBtn" onclick="startNextWave()">Start Wave 1</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GRID = 40;
const COLS = 10, ROWS = 16;

let money = 120;
let baseHealth = 100;
let wave = 1;
let waveInProgress = false;
let zombies = [];
let towers = [];
let particles = [];
let selectedTower = null;

const upgrades = {
  weapon: [
    {name:'Dmg',   level:0, base:40},
    {name:'Rng',   level:0, base:40},
    {name:'Rate',  level:0, base:50},
    {name:'Splash',level:0, base:90},
    {name:'Crit',  level:0, base:70}
  ],
  defence: [
    {name:'BaseHP', level:0, base:80},
    {name:'TwrHP',  level:0, base:70},
    {name:'Armor',  level:0, base:60},
    {name:'Regen',  level:0, base:100},
    {name:'Repair', level:0, base:120}
  ]
};

function cost(u){ return Math.round(u.base * Math.pow(1.5, u.level)); }
function statMultiplier(u, baseVal){ return baseVal + u.level * 0.15 * baseVal; }

const path = [
  {x:4,y:0},{x:4,y:3},{x:2,y:3},{x:2,y:6},{x:5,y:6},{x:5,y:9},
  {x:7,y:9},{x:7,y:12},{x:4,y:12},{x:4,y:15}
];
const pathSet = new Set(path.map(p=>p.x+','+p.y));
function inPath(x,y){ return pathSet.has(x+','+y); }

function startNextWave() {
  if (waveInProgress) return;
  waveInProgress = true;
  document.getElementById('waveBtn').disabled = true;
  document.getElementById('waveBtn').textContent = `Wave ${wave} In Progress...`;
  document.getElementById('action-tip').textContent = `Defend against the horde!`;
  spawnWave();
}

function spawnWave(){
  const count = 4 + wave * 2;
  for(let i=0; i<count; i++){
    setTimeout(() => { if(waveInProgress) spawnZombie(false); }, i * 600);
  }
  if(wave % 5 === 0) {
    setTimeout(() => { if(waveInProgress) spawnZombie(true); }, count * 600 + 400);
  }
}

function spawnZombie(isGiant){
  const baseSpeed = isGiant ? 0.45 : 0.85;
  const slowedSpeed = baseSpeed * 0.85;

  zombies.push({
    gx: path[0].x, gy: path[0].y,
    px: path[0].x * GRID + GRID / 2,
    py: path[0].y * GRID + GRID / 2,
    idx: 0,
    health: isGiant ? 400 + wave * 50 : 70 + wave * 15,
    maxHealth: isGiant ? 400 + wave * 50 : 70 + wave * 15,
    speed: slowedSpeed,
    // 40% extra money payout
    money: Math.round((isGiant ? 60 : 15) * 1.40),
    size: isGiant ? 24 : 15,
    giant: isGiant
  });
}

function handleInput(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  
  const x = Math.floor((clientX - r.left) * scaleX / GRID);
  const y = Math.floor((clientY - r.top) * scaleY / GRID);
  
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

  const existing = towers.find(t => t.gx === x && t.gy === y);
  if (existing) {
    selectedTower = existing;
    document.getElementById('action-tip').textContent = `Tower Selected.`;
    return;
  }

  if (selectedTower) {
    selectedTower = null;
  }

  if (inPath(x, y)) {
    document.getElementById('action-tip').textContent = `Cannot build on the path!`;
    return;
  }

  // Cost to build reduced by 70% ($80 -> $24)
  const towerCost = 24;
  if (money < towerCost) {
    document.getElementById('action-tip').textContent = `Not enough money! Need $${towerCost}`;
    return;
  }

  money -= towerCost;
  const maxHp = 100 * statMultiplier(upgrades.defence[1], 1);
  towers.push({ gx: x, gy: y, health: maxHp, maxHealth: maxHp, cd: 0 });
  document.getElementById('action-tip').textContent = `Tower built successfully! ($${towerCost})`;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.changedTouches.length > 0) {
    handleInput(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  handleInput(e.clientX, e.clientY);
});

function update(){
  if(!waveInProgress) return;

  // Move zombies
  zombies.forEach(z => {
    const target = path[Math.min(z.idx + 1, path.length - 1)];
    const targetX = target.x * GRID + GRID / 2;
    const targetY = target.y * GRID + GRID / 2;
    const dx = targetX - z.px;
    const dy = targetY - z.py;
    const dist = Math.hypot(dx, dy);

    if(dist < 2) {
      z.idx++;
      z.px = targetX;
      z.py = targetY;
    } else {
      z.px += (dx / dist) * z.speed;
      z.py += (dy / dist) * z.speed;
    }
  });

  // Filter dead or finished zombies
  zombies = zombies.filter(z => {
    if(z.health <= 0) {
      money += z.money;
      for(let i = 0; i < 5; i++) {
        particles.push({x: z.px, y: z.py, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3, life: 15, color: '#ffde7a'});
      }
      return false;
    }
    if(z.idx >= path.length) {
      baseHealth -= z.giant ? 15 : 5;
      if(baseHealth < 0) baseHealth = 0;
      return false;
    }
    return true;
  });

  // Check if wave is cleared
  if(zombies.length === 0) {
    waveInProgress = false;
    wave++;
    document.getElementById('wave').textContent = `Wave ${wave}`;
    const waveBtn = document.getElementById('waveBtn');
    waveBtn.disabled = false;
    waveBtn.textContent = `Start Wave ${wave}`;
    document.getElementById('action-tip').textContent = `Intermission: Buy upgrades, then start next wave!`;
  }

  // Tower Combat (Extra 20% damage: multiplied by 1.2, fire rate 20% faster)
  const dmg = 25 * 1.20 * statMultiplier(upgrades.weapon[0], 1);
  const range = 140 * statMultiplier(upgrades.weapon[1], 1);
  const fireRate = (0.8 * 1.2) * statMultiplier(upgrades.weapon[2], 1);
  const critChance = 0.1 * statMultiplier(upgrades.weapon[4], 1);

  towers.forEach(t => {
    t.cd = Math.max(0, t.cd - 1 / 60);
    if(t.cd > 0) return;

    let target = null;
    let bestDist = Infinity;
    const tx = t.gx * GRID + GRID / 2;
    const ty = t.gy * GRID + GRID / 2;

    zombies.forEach(z => {
      const d = Math.hypot(z.px - tx, z.py - ty);
      if(d <= range && d < bestDist) {
        bestDist = d;
        target = z;
      }
    });

    if(target) {
      t.cd = 1 / fireRate;
      const isCrit = Math.random() < critChance;
      const finalDmg = dmg * (isCrit ? 2 : 1);
      target.health -= finalDmg;

      particles.push({x: target.px, y: target.py, vx: 0, vy: -1.5, life: 12, color: isCrit ? '#ff3333' : '#ffde7a'});
    }
  });

  // Base & Tower Passive Regens
  const maxBaseHp = 100 * statMultiplier(upgrades.defence[0], 1);
  const regenAmt = 0.015 * statMultiplier(upgrades.defence[3], 1);
  if(baseHealth > 0 && baseHealth < maxBaseHp) {
    baseHealth = Math.min(maxBaseHp, baseHealth + regenAmt);
  }

  const repairAmt = 0.01 * statMultiplier(upgrades.defence[4], 1);
  towers.forEach(t => {
    if(t.health < t.maxHealth) {
      t.health = Math.min(t.maxHealth, t.health + repairAmt);
    }
  });
}

function draw(){
  ctx.clearRect(0, 0, W, H);

  // Draw Grid Lines
  ctx.strokeStyle = '#141d2b';
  ctx.lineWidth = 1;
  for(let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, H); ctx.stroke();
  }
  for(let i = 0; i <= ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * GRID); ctx.lineTo(W, i * GRID); ctx.stroke();
  }

  // Draw Path
  ctx.fillStyle = '#182436';
  path.forEach(p => ctx.fillRect(p.x * GRID + 2, p.y * GRID + 2, GRID - 4, GRID - 4));

  // Draw Selected Tower Radius Range Indicator
  if(selectedTower) {
    const tx = selectedTower.gx * GRID + GRID / 2;
    const ty = selectedTower.gy * GRID + GRID / 2;
    const range = 140 * statMultiplier(upgrades.weapon[1], 1);
    ctx.strokeStyle = 'rgba(50, 200, 120, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(tx, ty, range, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(50, 200, 120, 0.08)';
    ctx.fill();
  }

  // Draw Towers
  towers.forEach(t => {
    const x = t.gx * GRID + GRID / 2;
    const y = t.gy * GRID + GRID / 2;
    
    ctx.fillStyle = (selectedTower === t) ? '#5fe' : '#2ecc71';
    ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
    
    ctx.fillStyle = '#27ae60';
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();

    if(t.health < t.maxHealth) {
      ctx.fillStyle = '#000'; ctx.fillRect(x - 14, y - 24, 28, 3);
      ctx.fillStyle = '#2ecc71'; ctx.fillRect(x - 14, y - 24, 28 * (t.health / t.maxHealth), 3);
    }
  });

  // Draw Zombies
  zombies.forEach(z => {
    ctx.fillStyle = z.giant ? '#e74c3c' : '#27ae60';
    ctx.beginPath(); ctx.arc(z.px, z.py, z.size, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#000'; ctx.fillRect(z.px - 16, z.py - z.size - 8, 32, 4);
    ctx.fillStyle = '#e74c3c'; ctx.fillRect(z.px - 16, z.py - z.size - 8, 32 * Math.max(0, z.health / z.maxHealth), 4);
  });

  // Draw Particles
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life--;
  });
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    ctx.fillStyle = p.color || '#ffde7a';
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill();
  });
}

function loop(){
  update();
  draw();
  document.getElementById('money').textContent = `💰 ${Math.floor(money)}`;
  document.getElementById('base').textContent = `❤️ ${Math.max(0, Math.floor(baseHealth))}`;
  requestAnimationFrame(loop);
}

function buildUI(){
  const wDiv = document.getElementById('weaponUpgrades');
  wDiv.innerHTML = '';
  upgrades.weapon.forEach((u) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = `${u.name} L${u.level}\n$${cost(u)}`;
    b.onclick = () => buyUpgrade(u);
    wDiv.appendChild(b);
  });
  
  const dDiv = document.getElementById('defUpgrades');
  dDiv.innerHTML = '';
  upgrades.defence.forEach((u) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = `${u.name} L${u.level}\n$${cost(u)}`;
    b.onclick = () => buyUpgrade(u);
    dDiv.appendChild(b);
  });
}

function buyUpgrade(u){
  const c = cost(u);
  if(money < c) {
    document.getElementById('action-tip').textContent = `Can't afford ${u.name}! Need $${c}`;
    return;
  }
  money -= c;
  u.level++;
  document.getElementById('action-tip').textContent = `Upgraded ${u.name} to Level ${u.level}!`;
  buildUI();
}

buildUI();
loop();
</script>
</body>
</html>
